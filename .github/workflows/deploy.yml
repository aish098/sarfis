# Accountellence ERP Production SSH Deployment Workflow
name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST || '187.127.132.124' }}
          username: ${{ secrets.VPS_USER || 'ali' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            if [ -f ~/accountellence_fld/deploy.sh ]; then
              bash ~/accountellence_fld/deploy.sh
            else
              mkdir -p ~/accountellence_fld
              echo "VPS Directory Ready: ~/accountellence_fld"
            fi
