# Accountellence ERP Automated Production Deployment Workflow
name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            if [ -f ~/accountellence_fld/deploy.sh ]; then
              bash ~/accountellence_fld/deploy.sh
            else
              mkdir -p ~/accountellence_fld
              echo "VPS Directory Ready: ~/accountellence_fld"
            fi
